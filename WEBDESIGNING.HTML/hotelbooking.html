<!DOCTYPE html>
<html>
<head>
    <title>Hotel Booking Form</title>
</head>
<body BGCOLOR="LAVENDER">
<h1 ALIGN="CENTER"> HOTEL BOOKING FORM </h1>
<form>
<label><b>Full Name</b></label>
<input type="text" placeholder ="Enter your Name">
<br><br>
<label><b>Email</b></label>
<input type="email" placeholder="abc@example.com">
<br><br>
<label><b>Phone</b> </label>
<input type="tel" placeholder="0000000000">
<br><br>
<label><b>Check-in Date </b></label>
<input type="date">
<br><br>
<label><b>Check-out Date</b></label>
<input type="date">
<br><br>
<label><b>Room Type</b></label>
<select>
<option>Single Room</option>
<option>Double Room</option>
<option>Deluxe Room</option>
<option>Suite Room</option>
</select>
<br><br>
<label><b>Toal Guest Count</b> </label>
<input type="number" value="1" min="1">
<br><br>
<label><b>Special Request</b> </label>
<br>
<textarea rows="6" cols="40"></textarea>
<br><br>
<input type="submit"value="Book Now">
<P><B> THANK YOU </B></P> 
</body>
</html>
